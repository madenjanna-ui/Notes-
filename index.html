<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="notes@">
  <meta name="description" content="Личные заметки с цветными сворачиваемыми разделами. Работает офлайн.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>notes@</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar glass">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">n<span>@</span></div>
        <div><div class="brand-name">notes<span>@</span></div><div class="brand-subtitle">твои мысли — в порядке</div></div>
      </div>
      <div class="topbar-actions">
        <div class="font-controls" aria-label="Размер шрифта">
          <button id="fontDownBtn" class="font-button" aria-label="Уменьшить шрифт" title="Уменьшить шрифт">A−</button>
          <button id="fontUpBtn" class="font-button" aria-label="Увеличить шрифт" title="Увеличить шрифт">A+</button>
        </div>
        <button id="newNoteBtn" class="icon-button primary" aria-label="Новая заметка" title="Новая заметка">＋</button>
      </div>
    </header>

    <main class="layout">
      <section id="listPanel" class="list-panel glass">
        <div class="list-heading">
          <h1>Мои заметки</h1>
          <button id="backupBtn" class="quiet-button" title="Резервная копия">⇧</button>
        </div>
        <label class="searchbox"><span>⌕</span><input id="searchInput" type="search" placeholder="Поиск заметок и текста…" autocomplete="off"></label>
        <div id="notesList" class="notes-list" aria-live="polite"></div>
        <div class="list-footer"><span id="noteCount">0 заметок</span><button id="restoreBtn" class="text-button">Импорт копии</button><input id="restoreInput" type="file" accept="application/json,.json" hidden></div>
      </section>

      <section id="editorPanel" class="editor-panel glass">
        <div class="editor-toolbar">
          <button id="backBtn" class="quiet-button back-button" aria-label="К заметкам">‹</button>
          <span class="toolbar-label">Редактор</span>
          <button id="deleteNoteBtn" class="quiet-button danger" title="Удалить заметку" aria-label="Удалить заметку">⌫</button>
        </div>
        <div class="editor-scroll">
          <input id="noteTitle" class="note-title" placeholder="Название заметки" maxlength="140" aria-label="Название заметки">
          <textarea id="noteDescription" class="note-description" placeholder="Короткое описание (необязательно)" rows="2" aria-label="Описание заметки"></textarea>
          <div class="sections-heading"><h2>Разделы</h2><button id="addSectionBtn" class="small-primary">＋ Раздел</button></div>
          <div id="sectionsList" class="sections-list"></div>
          <button id="addFirstSectionBtn" class="add-first-section">＋ Добавить первый раздел</button>
          <div class="save-status" id="saveStatus">Сохраняется на этом устройстве</div>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <input id="importInput" type="file" accept="application/json,.json" hidden>
  </div>
  <script src="app.js"></script>
</body>
</html>
